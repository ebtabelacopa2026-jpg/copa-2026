<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Copa do Mundo 2026 • Tabela Completa com Pênaltis • Brasil no Grupo C</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(160deg, #009c3b 0%, #00a859 25%, #1e7a3e 50%, #fedd00 75%, #ffcb00 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            transition: background 0.5s ease;
            position: relative;
            overflow-x: hidden;
        }

        body.light-mode {
            background: linear-gradient(160deg, #f9f3e0 0%, #fff8dc 25%, #f0e68c 50%, #009c3b 90%, #007a2e 100%);
            background-attachment: fixed;
        }

        /* Overlay do Campeão */
        .champion-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .champion-overlay.active { display: flex; }

        .champion-content {
            position: relative;
            z-index: 10001;
            text-align: center;
            animation: championEntrance 1.5s ease-out;
        }
        @keyframes championEntrance {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .champion-flag {
            font-size: 8rem;
            animation: flagBounce 0.6s ease-out 1.5s both, flagGlow 2s infinite 2.1s;
            filter: drop-shadow(0 0 30px rgba(254, 221, 0, 0.8));
            display: block;
        }
        @keyframes flagBounce {
            0% { transform: translateY(-200px); opacity: 0; }
            50% { transform: translateY(20px); opacity: 1; }
            70% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
        @keyframes flagGlow {
            0%, 100% { filter: drop-shadow(0 0 30px rgba(254, 221, 0, 0.8)); }
            50% { filter: drop-shadow(0 0 60px rgba(254, 221, 0, 1)); }
        }

        .champion-name {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(to right, #fedd00, #ffaa00, #fedd00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 1rem 0;
            animation: nameGlow 2s infinite 2.1s;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        @keyframes nameGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
        }

        .champion-subtitle {
            font-size: 1.5rem;
            color: #fedd00;
            font-weight: 700;
            animation: subtitleFade 1s ease 2.5s both;
            letter-spacing: 2px;
        }
        @keyframes subtitleFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .trophy-container {
            margin-top: 2rem;
            animation: trophyRise 2s ease-out 3s both;
            position: relative;
        }
        @keyframes trophyRise {
            0% { transform: translateY(300px) rotate(-10deg); opacity: 0; }
            60% { transform: translateY(-20px) rotate(3deg); opacity: 1; }
            80% { transform: translateY(10px) rotate(-1deg); }
            100% { transform: translateY(0) rotate(0deg); opacity: 1; }
        }

        .trophy {
            font-size: 10rem;
            animation: trophyGlow 1.5s infinite 5s;
            filter: drop-shadow(0 0 40px rgba(254, 221, 0, 0.9));
            display: block;
        }
        @keyframes trophyGlow {
            0%, 100% { filter: drop-shadow(0 0 40px rgba(254, 221, 0, 0.9)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 80px rgba(254, 221, 0, 1.5)); transform: scale(1.05); }
        }

        .champion-flag-small {
            font-size: 4rem;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: flagOnTrophy 0.5s ease 4s both;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.5));
        }
        @keyframes flagOnTrophy {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .close-champion {
            position: fixed;
            top: 2rem; right: 2rem;
            z-index: 10002;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fedd00;
            color: #fedd00;
            font-size: 1.5rem;
            width: 50px; height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: closeBtnFade 1s ease 5s both;
        }
        @keyframes closeBtnFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .close-champion:hover {
            background: rgba(254, 221, 0, 0.3);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(254, 221, 0, 0.5);
        }

        .fireworks-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10000;
        }

        .firework-star {
            position: absolute;
            width: 4px; height: 4px;
            background: #fedd00;
            border-radius: 50%;
            animation: starBurst 2s ease-out forwards;
            box-shadow: 0 0 6px 2px rgba(254, 221, 0, 0.8), 0 0 12px 4px rgba(255, 170, 0, 0.5);
        }
        @keyframes starBurst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            50% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0.8; }
            100% { transform: translate(var(--fx), var(--fy)) scale(0); opacity: 0; }
        }

        .big-star {
            position: absolute;
            font-size: 3rem;
            animation: bigStarBurst 2.5s ease-out forwards;
            pointer-events: none;
            z-index: 10000;
        }
        @keyframes bigStarBurst {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; }
            50% { transform: translate(var(--stx), var(--sty)) scale(1.5) rotate(180deg); opacity: 0.8; }
            100% { transform: translate(var(--sfx), var(--sfy)) scale(0) rotate(360deg); opacity: 0; }
        }

        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            background: #fedd00;
            animation: confettiFall 3s ease-in forwards;
            pointer-events: none;
            z-index: 10000;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .confetti.green { background: #009c3b; }
        .confetti.blue { background: #0053b3; }
        .confetti.white { background: #fff; }

        /* ============ CONTAINER PRINCIPAL ============ */
        .container {
            max-width: 1500px;
            width: 100%;
            background: rgba(0, 50, 20, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(254, 221, 0, 0.4);
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        body.light-mode .container {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(0, 156, 59, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            gap: 0.8rem;
        }

        .title-section { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #fedd00, #ffcb00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }

        body.light-mode h1 {
            background: linear-gradient(135deg, #009c3b, #006622);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brazil-badge {
            background: linear-gradient(135deg, #009c3b, #fedd00);
            color: #005320;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-weight: 800;
            font-size: 0.8rem;
            border: 2px solid #fedd00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(254, 221, 0, 0.4); }
            50% { box-shadow: 0 0 25px rgba(254, 221, 0, 0.7); }
        }

        .save-indicator {
            color: #00ff55;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(0, 255, 100, 0.15);
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            display: none;
            align-items: center;
            gap: 0.3rem;
        }

        .save-indicator.show {
            display: flex;
            animation: fadeInOut 2s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        .theme-btn {
            background: rgba(0, 83, 179, 0.3);
            border: 2px solid rgba(254, 221, 0, 0.6);
            color: #fedd00;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-btn:hover { background: rgba(254, 221, 0, 0.3); color: #fff; }

        body.light-mode .theme-btn {
            background: rgba(0, 156, 59, 0.2);
            border-color: #009c3b;
            color: #006622;
        }

        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1.2rem;
            border-bottom: 2px solid rgba(254, 221, 0, 0.3);
            padding-bottom: 0.6rem;
        }

        body.light-mode .nav-tabs { border-bottom-color: rgba(0, 156, 59, 0.3); }

        .tab-btn {
            background: rgba(0, 83, 179, 0.2);
            border: 1px solid rgba(254, 221, 0, 0.3);
            padding: 0.5rem 0.9rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 0.78rem;
            color: #fedd00;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        body.light-mode .tab-btn {
            color: #006622;
            background: rgba(0, 156, 59, 0.1);
            border-color: rgba(0, 156, 59, 0.3);
        }

        .tab-btn.active {
            background: #fedd00;
            color: #005320;
            border: 2px solid #005320;
            box-shadow: 0 5px 20px rgba(254, 221, 0, 0.5);
        }

        body.light-mode .tab-btn.active {
            background: #009c3b;
            color: #fff;
            border-color: #fedd00;
        }

        .tab-btn.locked { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

        .panel { display: none; animation: fadeIn 0.35s ease; }
        .panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .groups-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }

        .group-card {
            background: linear-gradient(135deg, rgba(0, 83, 179, 0.3), rgba(0, 50, 20, 0.85));
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 1rem 0.7rem;
            border: 2px solid rgba(254, 221, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .group-card:hover { transform: translateY(-3px); border-color: #fedd00; }
        .group-card.brazil-group { border: 3px solid #fedd00; animation: pulse 2s infinite; }

        body.light-mode .group-card {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(0, 156, 59, 0.3);
        }

        .group-title {
            font-weight: 800;
            font-size: 1.1rem;
            text-align: center;
            color: #fedd00;
            border-bottom: 1px solid rgba(254, 221, 0, 0.3);
            padding-bottom: 0.4rem;
            margin-bottom: 0.6rem;
        }

        body.light-mode .group-title { color: #006622; border-bottom-color: rgba(0, 156, 59, 0.3); }

        .team-list { list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }

        .team-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(0, 83, 179, 0.25);
            border-radius: 2rem;
            padding: 0.35rem 0.6rem;
            font-weight: 600;
            color: #fff;
            font-size: 0.8rem;
        }

        body.light-mode .team-item { background: rgba(0, 156, 59, 0.1); color: #1a3a1a; }

        .team-item .pos-badge {
            font-size: 0.6rem;
            padding: 0.1rem 0.4rem;
            border-radius: 1rem;
            font-weight: 800;
            min-width: 18px;
            text-align: center;
        }

        .pos-1 { background: #00ff55; color: #003d10; }
        .pos-2 { background: #00cc44; color: #003d10; }
        .pos-3 { background: rgba(254, 221, 0, 0.5); color: #fedd00; }

        .games-count {
            text-align: center;
            margin-top: 0.5rem;
            font-size: 0.7rem;
            color: #fedd00;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.15rem 0.6rem;
            border-radius: 1rem;
        }

        .detail-container { margin-top: 1rem; }

        .back-btn {
            background: rgba(0, 83, 179, 0.4);
            border: 2px solid rgba(254, 221, 0, 0.6);
            color: #fedd00;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 700;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .back-btn:hover { background: rgba(254, 221, 0, 0.3); }

        .detail-title { font-size: 1.5rem; font-weight: 800; color: #fedd00; text-align: center; margin-bottom: 1rem; }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fedd00;
            margin: 1rem 0 0.5rem 0;
            padding-left: 0.8rem;
            border-left: 4px solid #fedd00;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0, 50, 20, 0.7);
            border-radius: 1rem;
            overflow: hidden;
            border: 2px solid rgba(254, 221, 0, 0.3);
            margin-bottom: 1rem;
        }

        th, td {
            padding: 0.5rem 0.3rem;
            text-align: center;
            color: #fff;
            font-size: 0.75rem;
            border-bottom: 1px solid rgba(254, 221, 0, 0.15);
        }

        th {
            background: rgba(254, 221, 0, 0.2);
            font-weight: 800;
            color: #fedd00;
            text-transform: uppercase;
            font-size: 0.7rem;
        }

        .team-cell { text-align: left; padding-left: 0.6rem; font-weight: 700; }

        .row-qualified { background: rgba(0, 255, 100, 0.2); border-left: 3px solid #00ff55; }
        .row-qualified td { color: #00ff55; font-weight: 700; }
        .row-third { background: rgba(254, 221, 0, 0.12); border-left: 3px solid #fedd00; }
        .row-third td { color: #fedd00; }
        .row-eliminated { opacity: 0.4; }

        .match-row {
            background: rgba(0, 50, 20, 0.7);
            border-radius: 1.2rem;
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            border: 1px solid rgba(254, 221, 0, 0.2);
            color: #fff;
        }

        .match-teams { display: flex; align-items: center; gap: 0.4rem; font-weight: 700; font-size: 0.9rem; min-width: 180px; }
        .score-group { display: flex; align-items: center; gap: 0.3rem; background: rgba(0, 0, 0, 0.3); padding: 0.2rem 0.5rem; border-radius: 1.5rem; }
        .score-input { width: 45px; padding: 0.25rem; text-align: center; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(254, 221, 0, 0.5); border-radius: 0.6rem; color: #fedd00; font-weight: 800; font-size: 0.9rem; }
        .score-input:focus { outline: none; border-color: #fedd00; box-shadow: 0 0 10px rgba(254, 221, 0, 0.5); }
        .score-sep { font-weight: 800; color: #fedd00; }
        .match-meta { display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; }
        .badge { padding: 0.15rem 0.5rem; border-radius: 1rem; font-weight: 700; font-size: 0.7rem; }
        .badge-date { background: rgba(0, 83, 179, 0.5); color: #fedd00; }
        .badge-time { background: rgba(254, 221, 0, 0.3); color: #fff; }
        .badge-status { font-size: 0.65rem; padding: 0.1rem 0.5rem; border-radius: 1rem; font-weight: 700; }
        .badge-pending { background: rgba(255, 255, 255, 0.1); color: #aaa; }
        .badge-done { background: rgba(0, 255, 100, 0.3); color: #00ff55; }

        .bracket-round {
            background: rgba(0, 50, 20, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 2px solid rgba(254, 221, 0, 0.3);
        }

        .bracket-round h3 { color: #fedd00; text-align: center; margin-bottom: 0.8rem; font-size: 1.1rem; }
        
        .bracket-match {
            background: rgba(0, 83, 179, 0.2);
            border-radius: 1rem;
            padding: 0.5rem 0.8rem;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            border: 1px solid rgba(254, 221, 0, 0.15);
        }

        .bracket-team { font-weight: 700; font-size: 0.85rem; min-width: 130px; }
        .bracket-team.winner { color: #00ff55; }

        .penalty-section {
            background: rgba(254, 221, 0, 0.1);
            border: 1px dashed rgba(254, 221, 0, 0.4);
            border-radius: 0.8rem;
            padding: 0.4rem 0.6rem;
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            font-size: 0.75rem;
            color: #fedd00;
            width: 100%;
        }

        .penalty-label {
            font-weight: 700;
            font-size: 0.7rem;
            color: #ffaa00;
        }

        .penalty-input {
            width: 35px;
            padding: 0.15rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 170, 0, 0.6);
            border-radius: 0.5rem;
            color: #ffaa00;
            font-weight: 800;
            font-size: 0.8rem;
        }

        .penalty-input:focus {
            outline: none;
            border-color: #ffaa00;
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
        }

        .penalty-winner {
            color: #00ff55;
            font-weight: 800;
            font-size: 0.75rem;
            margin-left: auto;
        }

        .footer-note { margin-top: 1.5rem; text-align: center; font-size: 0.75rem; color: #fedd00; background: rgba(0, 0, 0, 0.3); padding: 0.4rem 1rem; border-radius: 2rem; }
        body.light-mode .footer-note { color: #006622; background: rgba(0, 156, 59, 0.1); }
        .info-msg { text-align: center; color: #fedd00; padding: 2rem; font-size: 1rem; background: rgba(0, 0, 0, 0.2); border-radius: 1.5rem; }

        @media (max-width: 700px) {
            .container { padding: 1rem 0.7rem; }
            .match-row { flex-direction: column; align-items: flex-start; }
            h1 { font-size: 1.4rem; }
            .tab-btn { font-size: 0.7rem; padding: 0.4rem 0.6rem; }
            .champion-name { font-size: 2rem; }
            .champion-flag { font-size: 5rem; }
            .trophy { font-size: 6rem; }
        }
    </style>
</head>
<body>
    <!-- OVERLAY DO CAMPEÃO -->
    <div class="champion-overlay" id="championOverlay">
        <div class="fireworks-container" id="fireworksContainer"></div>
        <button class="close-champion" id="closeChampion" title="Fechar">✕</button>
        <div class="champion-content">
            <span class="champion-flag" id="championFlag">🏆</span>
            <div class="champion-name" id="championName">CAMPEÃO</div>
            <div class="champion-subtitle">Copa do Mundo FIFA 2026</div>
            <div class="trophy-container">
                <span class="trophy">🏆</span>
                <span class="champion-flag-small" id="championFlagSmall">🇧🇷</span>
            </div>
        </div>
    </div>

    <!-- TABELA PRINCIPAL -->
    <div class="container">
        <div class="header">
            <div class="title-section">
                <span style="font-size:2rem;">🏆</span>
                <h1>Copa 2026</h1>
                <span class="brazil-badge">🇧🇷 Brasil Grupo C</span>
                <span class="save-indicator" id="saveIndicator">💾 Salvo!</span>
            </div>
            <button id="themeToggle" class="theme-btn">
                <span id="themeIcon">🌙</span> <span id="themeText">Escuro</span>
            </button>
        </div>

        <div class="nav-tabs" id="navTabs">
            <button class="tab-btn active" data-tab="groups">🌍 Grupos</button>
            <button class="tab-btn" data-tab="matches">⚽ Jogos</button>
            <button class="tab-btn" data-tab="thirds">📊 3ºs</button>
            <button class="tab-btn locked" data-tab="r32" id="tabR32">32 avos</button>
            <button class="tab-btn locked" data-tab="r16" id="tabR16">Oitavas</button>
            <button class="tab-btn locked" data-tab="qf" id="tabQF">Quartas</button>
            <button class="tab-btn locked" data-tab="sf" id="tabSF">Semi</button>
            <button class="tab-btn locked" data-tab="final" id="tabFinal">🏆 Final</button>
        </div>

        <div id="panelGroups" class="panel active">
            <div class="groups-grid" id="groupsGrid"></div>

                ["15/06","16h","🇪🇸 Espanha","🇨🇻 Cabo Verde"],["15/06","22h","🇸🇦 Arábia Saudita","🇺🇾 Uruguai"],["21/06","19h","🇨🇻 Cabo Verde","🇸🇦 Arábia Saudita"],["21/06","22h","🇪🇸 Espanha","🇺🇾 Uruguai"],["27/06","19h","🇪🇸 Espanha","🇸🇦 Arábia Saudita"],["27/06","19h","🇨🇻 Cabo Verde","🇺🇾 Uruguai"],
                ["16/06","13h","🇫🇷 França","🇸🇳 Senegal"],["16/06","19h","🇮🇶 Iraque","🇳🇴 Noruega"],["22/06","16h","🇸🇳 Senegal","🇮🇶 Iraque"],["22/06","22h","🇫🇷 França","🇳🇴 Noruega"],["27/06","22h","🇫🇷 França","🇮🇶 Iraque"],["27/06","22h","🇸🇳 Senegal","🇳🇴 Noruega"],
                ["16/06","16h","🇦🇷 Argentina","🇩🇿 Argélia"],["16/06","22h","🇦🇹 Áustria","🇯🇴 Jordânia"],["22/06","19h","🇩🇿 Argélia","🇦🇹 Áustria"],["22/06","22h","🇦🇷 Argentina","🇯🇴 Jordânia"],["27/06","13h","🇦🇷 Argentina","🇦🇹 Áustria"],["27/06","13h","🇩🇿 Argélia","🇯🇴 Jordânia"],
                ["17/06","13h","🇵🇹 Portugal","🇨🇩 RD Congo"],["17/06","19h","🇺🇿 Uzbequistão","🇨🇴 Colômbia"],["23/06","16h","🇨🇩 RD Congo","🇺🇿 Uzbequistão"],["23/06","22h","🇵🇹 Portugal","🇨🇴 Colômbia"],["27/06","16h","🇵🇹 Portugal","🇺🇿 Uzbequistão"],["27/06","16h","🇨🇩 RD Congo","🇨🇴 Colômbia"],
                ["17/06","16h","🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra","🇭🇷 Croácia"],["17/06","22h","🇬🇭 Gana","🇵🇦 Panamá"],["23/06","19h","🇭🇷 Croácia","🇬🇭 Gana"],["23/06","22h","🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra","🇵🇦 Panamá"],["27/06","19h","🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra","🇬🇭 Gana"],["27/06","19h","🇭🇷 Croácia","🇵🇦 Panamá"]
            ];

            const matchDetails = {};
            for (let g = 0; g < 12; g++) for (let r = 0; r < 3; r++) for (let m = 0; m < 2; m++) {
                const idx = g * 6 + r * 2 + m;
                matchDetails[`${g}-${r}-${m}`] = { date: rawMatches[idx][0], time: rawMatches[idx][1], home: rawMatches[idx][2], away: rawMatches[idx][3] };
            }

            const STORAGE_KEY_GROUPS = 'copa2026v3_groupScores';
            const STORAGE_KEY_KO = 'copa2026v3_koScores';
            const STORAGE_KEY_PEN = 'copa2026v3_penScores';

            function loadFromStorage() { try { const gs = localStorage.getItem(STORAGE_KEY_GROUPS); if (gs) return JSON.parse(gs); } catch (e) {} return {}; }
            function saveToStorage() { try { localStorage.setItem(STORAGE_KEY_GROUPS, JSON.stringify(groupScores)); localStorage.setItem(STORAGE_KEY_KO, JSON.stringify(koScores)); localStorage.setItem(STORAGE_KEY_PEN, JSON.stringify(penScores)); showSaveIndicator(); } catch (e) {} }

            function showSaveIndicator() {
                const indicator = document.getElementById('saveIndicator');
                indicator.classList.remove('show');
                void indicator.offsetWidth;
                indicator.classList.add('show');
                setTimeout(() => indicator.classList.remove('show'), 2200);
            }

            const groupScores = loadFromStorage();
            let koScores = {};
            let penScores = {};
            try { const ks = localStorage.getItem(STORAGE_KEY_KO); if (ks) koScores = JSON.parse(ks); } catch (e) {}
            try { const ps = localStorage.getItem(STORAGE_KEY_PEN); if (ps) penScores = JSON.parse(ps); } catch (e) {}

            function getGroupScore(g, r, m) { return groupScores[`${g}-${r}-${m}`] || null; }
            function setGroupScore(g, r, m, h, a) { const k = `${g}-${r}-${m}`; if (h === '' && a === '') delete groupScores[k]; else groupScores[k] = { home: h !== '' ? parseInt(h) : null, away: a !== '' ? parseInt(a) : null }; saveToStorage(); }
            function isComplete(s) { return s && s.home !== null && s.away !== null && !isNaN(s.home) && !isNaN(s.away); }
            
            function getKoScore(round, m) { return koScores[`${round}-${m}`] || null; }
            function setKoScore(round, m, h, a) { const k = `${round}-${m}`; if (h === '' && a === '') delete koScores[k]; else koScores[k] = { home: h !== '' ? parseInt(h) : null, away: a !== '' ? parseInt(a) : null }; saveToStorage(); }
            
            function getPenScore(round, m) { return penScores[`${round}-${m}`] || null; }
            function setPenScore(round, m, h, a) { const k = `${round}-${m}`; if (h === '' && a === '') delete penScores[k]; else penScores[k] = { home: h !== '' ? parseInt(h) : null, away: a !== '' ? parseInt(a) : null }; saveToStorage(); }
            function isPenComplete(s) { return s && s.home !== null && s.away !== null && !isNaN(s.home) && !isNaN(s.away); }

            function getKoWinnerWithPenalties(round, m, t1, t2) {
                const sc = getKoScore(round, m);
                if (!sc || !isComplete(sc)) return null;
                if (sc.home > sc.away) return t1;
                if (sc.away > sc.home) return t2;
                // Empate - verificar pênaltis
                const pen = getPenScore(round, m);
                if (!pen || !isPenComplete(pen)) return null;
                if (pen.home > pen.away) return t1;
                if (pen.away > pen.home) return t2;
                return null;
            }

            function calcStandings(gi) {
                const teams = groupsData[gi].slice(1);
                const stats = {};
                teams.forEach(t => stats[t] = { pts: 0, j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, sg: 0 });
                for (let r = 0; r < 3; r++) for (let m = 0; m < 2; m++) {
                    const sc = getGroupScore(gi, r, m);
                    if (!isComplete(sc)) continue;
                    const det = matchDetails[`${gi}-${r}-${m}`];
                    const h = det.home, a = det.away;
                    if (!stats[h] || !stats[a]) continue;
                    stats[h].j++; stats[a].j++; stats[h].gp += sc.home; stats[h].gc += sc.away; stats[a].gp += sc.away; stats[a].gc += sc.home;
                    if (sc.home > sc.away) { stats[h].pts += 3; stats[h].v++; stats[a].d++; }
                    else if (sc.home < sc.away) { stats[a].pts += 3; stats[a].v++; stats[h].d++; }
                    else { stats[h].pts += 1; stats[a].pts += 1; stats[h].e++; stats[a].e++; }
                }
                teams.forEach(t => stats[t].sg = stats[t].gp - stats[t].gc);
                const sorted = [...teams].sort((a, b) => stats[b].pts - stats[a].pts || stats[b].sg - stats[a].sg || stats[b].gp - stats[a].gp);
                return { sorted, stats };
            }

            function countPlayed(gi) { let c = 0; for (let r = 0; r < 3; r++) for (let m = 0; m < 2; m++) if (isComplete(getGroupScore(gi, r, m))) c++; return c; }
            function allGroupsComplete() { for (let g = 0; g < 12; g++) if (countPlayed(g) < 6) return false; return true; }

            function getQualified() {
                const firsts = [], seconds = [], thirds = [];
                for (let g = 0; g < 12; g++) {
                    const { sorted, stats } = calcStandings(g);
                    if (sorted.length >= 3 && countPlayed(g) === 6) {
                        firsts.push({ team: sorted[0], group: groupsData[g][0], pts: stats[sorted[0]].pts, sg: stats[sorted[0]].sg });
                        seconds.push({ team: sorted[1], group: groupsData[g][0], pts: stats[sorted[1]].pts, sg: stats[sorted[1]].sg });
                        thirds.push({ team: sorted[2], group: groupsData[g][0], pts: stats[sorted[2]].pts, sg: stats[sorted[2]].sg, gp: stats[sorted[2]].gp });
                    }
                }
                thirds.sort((a, b) => b.pts - a.pts || b.sg - a.sg || b.gp - a.gp);
                return { firsts, seconds, thirds: thirds.slice(0, 8) };
            }

            function generateR32() {
                const { firsts, seconds, thirds } = getQualified();
                if (firsts.length < 12) return [];
                const matches = [];
                const fSorted = [...firsts].sort((a, b) => b.pts - a.pts || b.sg - a.sg);
                const sSorted = [...seconds].sort((a, b) => b.pts - a.pts || b.sg - a.sg);
                for (let i = 0; i < 8; i++) matches.push({ t1: fSorted[i].team, t2: thirds[i]?.team || "?" });
                const rf = fSorted.slice(8);
                for (let i = 0; i < 4; i++) matches.push({ t1: rf[i]?.team || "?", t2: sSorted[i + 8]?.team || sSorted[i]?.team || "?" });
                for (let i = 0; i < 4; i++) matches.push({ t1: sSorted[i].team, t2: sSorted[i + 4].team });
                return matches.slice(0, 16);
            }

            function simulateBracket(r32) {
                const w32 = []; for (let i = 0; i < 16; i++) w32.push(getKoWinnerWithPenalties('r32', i, r32[i].t1, r32[i].t2) || `Vencedor ${i + 1}`);
                const r16 = []; for (let i = 0; i < 8; i++) r16.push({ t1: w32[i * 2], t2: w32[i * 2 + 1] });
                const w16 = []; for (let i = 0; i < 8; i++) w16.push(getKoWinnerWithPenalties('r16', i, r16[i].t1, r16[i].t2) || `Vencedor O${i + 1}`);
                const qf = []; for (let i = 0; i < 4; i++) qf.push({ t1: w16[i * 2], t2: w16[i * 2 + 1] });
                const wqf = []; for (let i = 0; i < 4; i++) wqf.push(getKoWinnerWithPenalties('qf', i, qf[i].t1, qf[i].t2) || `Vencedor Q${i + 1}`);
                const sf = [{ t1: wqf[0], t2: wqf[1] }, { t1: wqf[2], t2: wqf[3] }];
                const wsf = []; for (let i = 0; i < 2; i++) wsf.push(getKoWinnerWithPenalties('sf', i, sf[i].t1, sf[i].t2) || `Vencedor S${i + 1}`);
                const fin = { t1: wsf[0], t2: wsf[1] };
                const champ = getKoWinnerWithPenalties('final', 0, fin.t1, fin.t2);
                return { r16, qf, sf, fin, champ };
            }

            // ============ ANIMAÇÃO DO CAMPEÃO ============
            function extractFlagAndName(teamString) {
                if (!teamString) return { flag: '🏆', name: 'CAMPEÃO' };
                const match = teamString.match(/^([\u{1F1E6}-\u{1F1FF}\u{1F3F4}\u200D\u{2620}\u{FE0F}\u{1F3F3}\u{FE0F}\u{200D}\u{1F308}\u{1F1E6}-\u{1F1FF}\u{1F3F4}\u{E0061}-\u{E007A}\u{E007F}]+)\s*(.*)/u);
                if (match) return { flag: match[1], name: match[2] || teamString };
                return { flag: '🏆', name: teamString };
            }

            function showChampionAnimation(championTeam) {
                const { flag, name } = extractFlagAndName(championTeam);
                document.getElementById('championFlag').textContent = flag;
                document.getElementById('championName').textContent = name;
                document.getElementById('championFlagSmall').textContent = flag;

            function createFireworks(container) {
                const colors = ['#fedd00', '#ffaa00', '#ffcc00', '#ffe566', '#ff9900', '#ffd700'];
                for (let burst = 0; burst < 8; burst++) {
                    const burstX = Math.random() * 100;
                    const burstY = Math.random() * 60 + 10;
                    for (let i = 0; i < 30; i++) {
                        const star = document.createElement('div');
                        star.className = 'firework-star';
                        const angle = (i / 30) * Math.PI * 2;
                        const distance = 80 + Math.random() * 150;
                        star.style.setProperty('--tx', `${Math.cos(angle) * distance * 0.5}px`);
                        star.style.setProperty('--ty', `${Math.sin(angle) * distance * 0.5}px`);
                        star.style.setProperty('--fx', `${Math.cos(angle) * distance}px`);
                        star.style.setProperty('--fy', `${Math.sin(angle) * distance}px`);
                        star.style.left = `${burstX}%`;
                        star.style.top = `${burstY}%`;
                        star.style.background = colors[Math.floor(Math.random() * colors.length)];
                        star.style.animationDuration = `${1.5 + Math.random() * 2}s`;
                        star.style.animationDelay = `${burst * 0.3 + Math.random() * 0.5}s`;
                        container.appendChild(star);
                    }
                }
            }

            function createBigStars(container) {
                for (let i = 0; i < 20; i++) {
                    const star = document.createElement('span');
                    star.className = 'big-star';
                    star.textContent = '⭐';
                    star.style.left = `${Math.random() * 90}%`;
                    star.style.top = `${Math.random() * 80}%`;
                    star.style.setProperty('--stx', `${(Math.random() - 0.5) * 200}px`);
                    star.style.setProperty('--sty', `${(Math.random() - 0.5) * 200}px`);
                    star.style.setProperty('--sfx', `${(Math.random() - 0.5) * 400}px`);
                    star.style.setProperty('--sfy', `${(Math.random() - 0.5) * 400}px`);
                    star.style.animationDelay = `${Math.random() * 2}s`;
                    star.style.fontSize = `${1.5 + Math.random() * 3}rem`;
                    container.appendChild(star);
                }

            function createConfetti(container) {
                const colors = ['confetti', 'green', 'blue', 'white'];
                for (let i = 0; i < 80; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = `confetti ${colors[Math.floor(Math.random() * colors.length)]}`;
                    confetti.style.left = `${Math.random() * 100}%`;
                    confetti.style.animationDelay = `${Math.random() * 3}s`;
                    confetti.style.animationDuration = `${2 + Math.random() * 3}s`;
                    confetti.style.width = `${6 + Math.random() * 10}px`;
                    confetti.style.height = `${6 + Math.random() * 10}px`;

                    container.appendChild(confetti);
                }
            }

            function hideChampionAnimation() {
                document.getElementById('championOverlay').classList.remove('active');
                document.body.style.overflow = '';
                document.getElementById('fireworksContainer').innerHTML = '';

            document.getElementById('closeChampion').addEventListener('click', hideChampionAnimation);
            document.getElementById('championOverlay').addEventListener('click', function(e) { if (e.target === this) hideChampionAnimation(); });

            // ============ RENDERIZAÇÃO ============
            const $ = id => document.getElementById(id);
            const groupsGrid = $('groupsGrid');
            const groupDetail = $('groupDetail');
            const allMatchesContent = $('allMatchesContent');
            const thirdsContent = $('thirdsContent');
            const r32Content = $('r32Content');
            const r16Content = $('r16Content');

            const tabBtns = document.querySelectorAll('.tab-btn');

            function renderGroups() {
                groupsGrid.innerHTML = groupsData.map((g, i) => {
                    const pc = countPlayed(i);
                    const { sorted } = calcStandings(i);
                    const isB = g[0] === "Grupo C";
                    const order = (pc === 6 && sorted.length === 4) ? sorted : g.slice(1);
                    return `<div class="group-card${isB ? ' brazil-group' : ''}" data-gi="${i}"><div class="group-title">${g[0]}${isB ? ' 🇧🇷' : ''}</div><ul class="team-list">${order.map((t, idx) => { let cls = ''; if (pc === 6) { if (idx === 0) cls = 'pos-1'; else if (idx === 1) cls = 'pos-2'; else if (idx === 2) cls = 'pos-3'; } return `<li class="team-item">${cls ? `<span class="pos-badge ${cls}">${idx + 1}º</span>` : ''}<span>${t}</span></li>`; }).join('')}</ul><div class="games-count">${pc}/6 jogos</div></div>`;
                }).join('');
                document.querySelectorAll('.group-card').forEach(c => c.addEventListener('click', () => showGroupDetail(parseInt(c.dataset.gi))));
            }

            function showGroupDetail(gi) {
                const g = groupsData[gi];
                const { sorted, stats } = calcStandings(gi);
                const pc = countPlayed(gi);
                const ap = pc === 6;
                let h = `<button class="back-btn" onclick="window.backToGroups()">← Voltar</button><div class="detail-title">${g[0]}</div><div class="section-title">📊 Classificação (${pc}/6 jogos)</div><table><thead><tr><th>Pos</th><th>Seleção</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr></thead><tbody>`;
                if (pc === 0) h += '<tr><td colspan="10" style="text-align:center;padding:1.5rem;">⚽ Nenhum jogo ainda</td></tr>';
                else sorted.forEach((t, idx) => { const s = stats[t]; let rc = ''; if (ap) { if (idx < 2) rc = 'row-qualified'; else if (idx === 2) rc = 'row-third'; else rc = 'row-eliminated'; } h += `<tr class="${rc}"><td>${idx + 1}º</td><td class="team-cell">${t}</td><td><strong>${s.pts}</strong></td><td>${s.j}</td><td>${s.v}</td><td>${s.e}</td><td>${s.d}</td><td>${s.gp}</td><td>${s.gc}</td><td>${s.sg > 0 ? '+' + s.sg : s.sg}</td></tr>`; });
                h += `</tbody></table><div class="section-title">⚽ Confrontos</div>`;
                for (let r = 0; r < 3; r++) { h += `<div style="font-weight:700;color:#fedd00;margin-top:0.6rem;">Rodada ${r + 1}</div>`; for (let m = 0; m < 2; m++) { const det = matchDetails[`${gi}-${r}-${m}`]; const sc = getGroupScore(gi, r, m); const pl = isComplete(sc); h += `<div class="match-row"><div class="match-teams"><span>${det.home}</span> vs <span>${det.away}</span><span class="badge-status ${pl ? 'badge-done' : 'badge-pending'}">${pl ? '✓' : 'Pendente'}</span></div><div class="score-group"><input type="number" class="score-input gs-home" value="${sc && sc.home !== null ? sc.home : ''}" min="0" max="20" placeholder="-" data-g="${gi}" data-r="${r}" data-m="${m}" data-side="home"><span class="score-sep">×</span><input type="number" class="score-input gs-away" value="${sc && sc.away !== null ? sc.away : ''}" min="0" max="20" placeholder="-" data-g="${gi}" data-r="${r}" data-m="${m}" data-side="away"></div><div class="match-meta"><span class="badge badge-date">📅 ${det.date}</span><span class="badge badge-time">🕐 ${det.time}</span></div></div>`; } }
                groupDetail.innerHTML = h;
                groupDetail.style.display = 'block';
                groupsGrid.style.display = 'none';
                document.querySelectorAll('.gs-home, .gs-away').forEach(inp => inp.addEventListener('input', groupScoreHandler));
            }

            window.backToGroups = function() { groupDetail.style.display = 'none'; groupsGrid.style.display = ''; renderGroups(); updateKnockoutTabs(); };

            function groupScoreHandler() { const gi = parseInt(this.dataset.g), r = parseInt(this.dataset.r), m = parseInt(this.dataset.m); const row = this.closest('.match-row'); setGroupScore(gi, r, m, row.querySelector('.gs-home').value.trim(), row.querySelector('.gs-away').value.trim()); const sc = getGroupScore(gi, r, m); const badge = row.querySelector('.badge-status'); if (isComplete(sc)) { badge.textContent = '✓'; badge.className = 'badge-status badge-done'; } else { badge.textContent = 'Pendente'; badge.className = 'badge-status badge-pending'; } updateStandingsInDetail(gi); updateKnockoutTabs(); }

            function updateStandingsInDetail(gi) { const { sorted, stats } = calcStandings(gi); const pc = countPlayed(gi); const ap = pc === 6; const tb = document.querySelector('table tbody'); if (!tb) return; if (pc === 0) { tb.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:1.5rem;">⚽ Nenhum jogo ainda</td></tr>'; return; } tb.innerHTML = sorted.map((t, idx) => { const s = stats[t]; let rc = ''; if (ap) { if (idx < 2) rc = 'row-qualified'; else if (idx === 2) rc = 'row-third'; else rc = 'row-eliminated'; } return `<tr class="${rc}"><td>${idx + 1}º</td><td class="team-cell">${t}</td><td><strong>${s.pts}</strong></td><td>${s.j}</td><td>${s.v}</td><td>${s.e}</td><td>${s.d}</td><td>${s.gp}</td><td>${s.gc}</td><td>${s.sg > 0 ? '+' + s.sg : s.sg}</td></tr>`; }).join(''); renderGroups(); }

            function renderAllMatches() { allMatchesContent.innerHTML = groupsData.map((g, gi) => { const pc = countPlayed(gi); let h = `<div class="detail-title" style="font-size:1.2rem;">${g[0]} (${pc}/6)</div>`; for (let r = 0; r < 3; r++) { h += `<div style="font-weight:700;color:#fedd00;margin-top:0.5rem;">Rodada ${r + 1}</div>`; for (let m = 0; m < 2; m++) { const det = matchDetails[`${gi}-${r}-${m}`]; const sc = getGroupScore(gi, r, m); const pl = isComplete(sc); h += `<div class="match-row"><div class="match-teams"><span>${det.home}</span> vs <span>${det.away}</span><span class="badge-status ${pl?'badge-done':'badge-pending'}">${pl?'✓':'Pendente'}</span></div><div class="score-group"><span class="score-sep">${pl?sc.home+' × '+sc.away:'- × -'}</span></div><div class="match-meta"><span class="badge badge-date">📅 ${det.date}</span><span class="badge badge-time">🕐 ${det.time}</span></div></div>`; } } return h; }).join(''); }

            function renderThirds() { const allT = []; for (let g = 0; g < 12; g++) { const { sorted, stats } = calcStandings(g); if (sorted.length >= 3 && countPlayed(g) === 6) allT.push({ team: sorted[2], group: groupsData[g][0], pts: stats[sorted[2]].pts, sg: stats[sorted[2]].sg, gp: stats[sorted[2]].gp, j: stats[sorted[2]].j }); } allT.sort((a, b) => b.pts - a.pts || b.sg - a.sg || b.gp - a.gp); let h = `<div class="detail-title">📊 Melhores 3ºs</div><table><thead><tr><th>Pos</th><th>Grupo</th><th>Seleção</th><th>P</th><th>J</th><th>SG</th><th>GP</th></tr></thead><tbody>`; allT.forEach((t, i) => { h += `<tr class="${i<8?'row-qualified':'row-eliminated'}"><td>${i+1}º</td><td>${t.group}</td><td>${t.team}</td><td><strong>${t.pts}</strong></td><td>${t.j}</td><td>${t.sg>0?'+'+t.sg:t.sg}</td><td>${t.gp}</td></tr>`; }); h += `</tbody></table>`; thirdsContent.innerHTML = h; }

            function renderKoStage(round, matches, container, title) {
                if (!matches || !matches.length) { container.innerHTML = '<div class="info-msg">Preencha todos os grupos primeiro para gerar os confrontos.</div>'; return; }
                let h = `<div class="bracket-round"><h3>${title}</h3>`;
                matches.forEach((m, i) => {
                    const sc = getKoScore(round, i);
                    const pen = getPenScore(round, i);
                    const pl = sc && isComplete(sc);
                    const penPl = pen && isPenComplete(pen);
                    const isDraw = pl && sc.home === sc.away;
                    const w = getKoWinnerWithPenalties(round, i, m.t1, m.t2);
                    h += `<div class="bracket-match">
                <span class="bracket-team${w===m.t1?' winner':''}">${m.t1}</span>
                <span class="score-sep">vs</span>
                <span class="bracket-team${w===m.t2?' winner':''}">${m.t2}</span>
                <div class="score-group">
                  <input type="number" class="score-input ko-home" value="${sc&&sc.home!==null?sc.home:''}" min="0" max="20" placeholder="-" data-round="${round}" data-m="${i}" data-side="home">
                  <span class="score-sep">×</span>
                  <input type="number" class="score-input ko-away" value="${sc&&sc.away!==null?sc.away:''}" min="0" max="20" placeholder="-" data-round="${round}" data-m="${i}" data-side="away">
                </div>`;
                    if (isDraw) {
                        h += `<div class="penalty-section">
                  <span class="penalty-label">⚽ Pênaltis:</span>
                  <input type="number" class="penalty-input pen-home" value="${penPl&&pen.home!==null?pen.home:''}" min="0" max="20" placeholder="-" data-round="${round}" data-m="${i}" data-side="home">
                  <span class="score-sep">×</span>
                  <input type="number" class="penalty-input pen-away" value="${penPl&&pen.away!==null?pen.away:''}" min="0" max="20" placeholder="-" data-round="${round}" data-m="${i}" data-side="away">
                  ${w ? `<span class="penalty-winner">🏆 ${w} vence nos pênaltis</span>` : (penPl ? '<span style="color:#ffaa00;font-size:0.7rem;">Pênaltis empatados</span>' : '')}
                </div>`;
                    }
                    if (w && !isDraw) h += `<span style="color:#00ff55;font-weight:700;font-size:0.8rem;">🏆 ${w}</span>`;
                    h += `</div>`;
                });
                h += `</div>`;
                container.innerHTML = h;
                container.querySelectorAll('.ko-home, .ko-away').forEach(inp => inp.addEventListener('input', koScoreHandler));
                container.querySelectorAll('.pen-home, .pen-away').forEach(inp => inp.addEventListener('input', penScoreHandler));
            }

            function koScoreHandler() { const round = this.dataset.round, m = parseInt(this.dataset.m); const row = this.closest('.bracket-match'); setKoScore(round, m, row.querySelector('.ko-home').value.trim(), row.querySelector('.ko-away').value.trim()); updateAllKoStages(); }

            function penScoreHandler() { const round = this.dataset.round, m = parseInt(this.dataset.m); const row = this.closest('.bracket-match'); setPenScore(round, m, row.querySelector('.pen-home').value.trim(), row.querySelector('.pen-away').value.trim()); updateAllKoStages(); }

            function updateAllKoStages() { if (!allGroupsComplete()) return; const r32 = generateR32(); if (!r32.length) return; const { r16, qf, sf, fin, champ } = simulateBracket(r32); renderKoStage('r32', r32, r32Content, '32 avos de final'); renderKoStage('r16', r16, r16Content, 'Oitavas de final'); renderKoStage('qf', qf, qfContent, 'Quartas de final'); renderKoStage('sf', sf, sfContent, 'Semifinais'); let fh = `<div class="bracket-round"><h3>🏆 Final</h3><div class="bracket-match"><span class="bracket-team${champ===fin.t1?' winner':''}">${fin.t1}</span><span class="score-sep">vs</span><span class="bracket-team${champ===fin.t2?' winner':''}">${fin.t2}</span><div class="score-group"><input type="number" class="score-input ko-home" value="${getKoScore('final',0)?.home??''}" min="0" max="20" placeholder="-" data-round="final" data-m="0" data-side="home"><span class="score-sep">×</span><input type="number" class="score-input ko-away" value="${getKoScore('final',0)?.away??''}" min="0" max="20" placeholder="-" data-round="final" data-m="0" data-side="away"></div>`;
                const fsc = getKoScore('final', 0);
                if (fsc && isComplete(fsc) && fsc.home === fsc.away) {
                    const fpen = getPenScore('final', 0);
                    const fpenPl = fpen && isPenComplete(fpen);
                    fh += `<div class="penalty-section"><span class="penalty-label">⚽ Pênaltis:</span><input type="number" class="penalty-input pen-home" value="${fpenPl&&fpen.home!==null?fpen.home:''}" min="0" max="20" placeholder="-" data-round="final" data-m="0" data-side="home"><span class="score-sep">×</span><input type="number" class="penalty-input pen-away" value="${fpenPl&&fpen.away!==null?fpen.away:''}" min="0" max="20" placeholder="-" data-round="final" data-m="0" data-side="away">${champ ? `<span class="penalty-winner">🏆 ${champ} vence nos pênaltis</span>` : ''}</div>`;
                }
                fh += `</div></div>`;
                if (champ) { fh += `<div class="champion-card" style="cursor:pointer;" onclick="window.showChampionAnimation('${champ}')">🏆 CAMPEÃO: ${champ} 🏆<br><small style="font-size:0.7rem;">Clique para ver a animação!</small></div>`; }
                finalContent.innerHTML = fh;
                finalContent.querySelectorAll('.ko-home, .ko-away').forEach(inp => inp.addEventListener('input', koScoreHandler));
                finalContent.querySelectorAll('.pen-home, .pen-away').forEach(inp => inp.addEventListener('input', penScoreHandler));
            }

            window.showChampionAnimation = showChampionAnimation;

            function updateKnockoutTabs() { const complete = allGroupsComplete(); ['tabR32', 'tabR16', 'tabQF', 'tabSF', 'tabFinal'].forEach(id => { const tab = document.getElementById(id); if (complete) tab.classList.remove('locked'); else tab.classList.add('locked'); }); if (complete) updateAllKoStages(); }

            function switchTab(tabId) { tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tabId)); Object.keys(panels).forEach(k => panels[k].classList.remove('active')); const map = { groups: 'groups', matches: 'matches', thirds: 'thirds', r32: 'r32', r16: 'r16', qf: 'qf', sf: 'sf', final: 'final' }; const panelKey = map[tabId]; if (panelKey && panels[panelKey]) panels[panelKey].classList.add('active'); if (tabId === 'groups' && groupDetail.style.display === 'block') window.backToGroups(); if (tabId === 'matches') renderAllMatches(); if (tabId === 'thirds') renderThirds(); if (allGroupsComplete() && ['r32', 'r16', 'qf', 'sf', 'final'].includes(tabId)) updateAllKoStages(); }
            tabBtns.forEach(b => { b.addEventListener('click', () => { if (b.classList.contains('locked')) return; switchTab(b.dataset.tab); }); });

            const body = document.body;
            const themeToggle = $('themeToggle');
            function setTheme(m) { if (m === 'light') { body.classList.add('light-mode'); $('themeIcon').textContent = '☀️'; $('themeText').textContent = 'Claro'; localStorage.setItem('copa2026theme', 'light'); } else { body.classList.remove('light-mode'); $('themeIcon').textContent = '🌙'; $('themeText').textContent = 'Escuro'; localStorage.setItem('copa2026theme', 'dark'); } }
            themeToggle.addEventListener('click', () => setTheme(body.classList.contains('light-mode') ? 'dark' : 'light'));
            document.addEventListener('keydown', function(e) { if (e.target.classList.contains('score-input') || e.target.classList.contains('penalty-input')) { const allowed = [8, 46, 9, 27, 13, 37, 38, 39, 40]; if (allowed.includes(e.keyCode) || (e.keyCode >= 48 && e.keyCode <= 57) || (e.keyCode >= 96 && e.keyCode <= 105)) return; e.preventDefault(); } });

            function init() { renderGroups(); renderAllMatches(); renderThirds(); setTheme(localStorage.getItem('copa2026theme') === 'light' ? 'light' : 'dark'); switchTab('groups'); updateKnockoutTabs(); }
            window.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
